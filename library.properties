sentence=Portable C99 building blocks for embedded and IoT firmware.
paragraph=It provides non-blocking software timers, an ISR-safe framed serial protocol with XOR checksum, a CAN 2.0B identifier codec, and sensor helpers with stale-data detection. The core has no vendor headers and no dynamic allocation, so it compiles and unit-tests on a PC and drops into STM32, ESP32, or Arduino behind a thin port layer.
