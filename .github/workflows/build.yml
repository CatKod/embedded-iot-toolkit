name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }}

      - name: Build and run tests
        run: |
          ${{ matrix.compiler }} -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -Isrc -Itest \
            src/ekt_soft_timer.c \
            src/ekt_frame.c \
            src/ekt_can_codec.c \
            src/ekt_sensor.c \
            port/posix/ekt_port_posix.c \
            test/test_core.c \
            -o build_${{ matrix.compiler }}
          ./build_${{ matrix.compiler }}

  arduino-lint:
    name: Arduino Library Specification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-lint
        run: |
          set -euo pipefail
          version="1.3.0"
          curl -fsSL -o arduino-lint.tar.gz \
            "https://github.com/arduino/arduino-lint/releases/download/${version}/arduino-lint_${version}_Linux_64bit.tar.gz"
          tar -xzf arduino-lint.tar.gz
          sudo install -m 0755 arduino-lint /usr/local/bin/arduino-lint
          arduino-lint --version

      - name: Lint the library
        run: arduino-lint --compliance strict --library-manager submit "$GITHUB_WORKSPACE"

  esp-idf:
    name: ESP-IDF component build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF
        run: |
          set -euo pipefail
          idf_version="v5.5.3"
          git clone --depth 1 --branch "$idf_version" --recursive \
            https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          "$HOME/esp-idf/install.sh" esp32s3
          echo "IDF_PATH=$HOME/esp-idf" >> "$GITHUB_ENV"
          echo "$HOME/esp-idf/export.sh" >> "$GITHUB_PATH"

      - name: Build the component in a host project
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null 2>&1
          mkdir -p example_project/main example_project/components
          cp examples/esp32_timer/CMakeLists.txt example_project/
          cp examples/esp32_timer/main/* example_project/main/
          # The component directory name must match the registry dependency
          # name in namespace__name form so that the local working tree
          # satisfies "catkod/embedded-iot-toolkit" without hitting the
          # registry.
          ln -s "$GITHUB_WORKSPACE" \
            example_project/components/catkod__embedded-iot-toolkit
          cd example_project
          idf.py set-target esp32s3
          idf.py build

      - name: Pack the component archive
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" >/dev/null 2>&1
          pip install --upgrade idf-component-manager
          compote component pack --name embedded-iot-toolkit
          tar -czf ekt-component.tar.gz dist/embedded-iot-toolkit_*.tgz
          cat ekt-component.tar.gz > "$GITHUB_STEP_SUMMARY"

      - name: Upload the component archive as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: embedded-iot-toolkit-component
          path: ekt-component.tar.gz
